name: IndexNow

# After Cloudflare Pages finishes deploying a push to main, tell IndexNow
# (Bing and partners) which pages changed. Google does not support IndexNow;
# it reads the sitemap's lastmod dates instead.
on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the Cloudflare Pages deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            result=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '.check_runs[] | select(.name == "Cloudflare Pages") | "\(.status) \(.conclusion)"' | head -1)
            echo "Cloudflare Pages: ${result:-not reported yet}"
            case "$result" in
              "completed success") exit 0 ;;
              completed*) echo "::error::Cloudflare Pages deploy did not succeed ($result)"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the Cloudflare Pages deploy"
          exit 1

      - name: Submit changed pages
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed=$(git show --name-only --format= "${{ github.sha }}")
          else
            changed=$(git diff --name-only "$before" "${{ github.sha }}")
          fi
          node scripts/indexnow.mjs $changed
