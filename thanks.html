<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | YesCoach</title>
    <meta name="robots" content="noindex">

    <!-- Shared styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Google Fonts - preloaded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=block">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=block" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            padding: var(--space-2xl) 0;
        }

        .thank-you {
            text-align: center;
        }

        .checkmark {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-xl);
        }

        .checkmark svg {
            width: 32px;
            height: 32px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--color-charcoal);
            margin-bottom: var(--space-lg);
            letter-spacing: -0.02em;
        }

        .message {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-md);
            line-height: 1.7;
        }

        .note {
            font-size: 1rem;
            color: var(--color-text-muted);
            margin-top: var(--space-xl);
            padding-top: var(--space-xl);
            border-top: 1px solid var(--color-soft-shadow);
        }

        .back-link {
            display: inline-block;
            margin-top: var(--space-xl);
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">
                <img src="/logo.png" alt="YesCoach logo">
                <span>YesCoach</span>
            </a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="thank-you">
                <div class="checkmark">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>

                <h1>Thank you!</h1>

                <p class="message">
                    Really appreciate your interest — it means a lot.
                </p>

                <p class="message">
                    We're excited about what we're building and can't wait to share it with you. Hoping to have a working version in your hands very soon.
                </p>

                <p class="note">
                    We'll be in touch.
                </p>

                <a href="/" class="back-link">← Back to YesCoach</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · © 2026 YesCoach</p>
        </div>
    </footer>
</body>
</html>
