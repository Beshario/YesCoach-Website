[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://yescoach.app/*"
  to = "https://yescoach.fit/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.yescoach.fit/*"
  to = "https://yescoach.fit/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/thanks.html"
  to = "/thanks"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
