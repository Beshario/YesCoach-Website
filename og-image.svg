  <rect x="80" y="500" width="240" height="44" rx="6" fill="#4A8FE3"/>
  <text x="200" y="528" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">Free on Android</text>

  <!-- URL -->
