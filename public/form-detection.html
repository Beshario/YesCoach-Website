<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Detection</title>
</head>
<body>
  <!-- This file helps Netlify detect forms for static form handling -->
  <form name="early-access" netlify netlify-honeypot="bot-field" hidden>
    <input type="email" name="email" />
    <p hidden>
      <label>
        Don't fill this out if you're human: <input name="bot-field" />
      </label>
    </p>
  </form>
</body>
</html>
